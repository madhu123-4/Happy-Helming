name: Calculate Version

on:
  workflow_call:

jobs:
  calculate-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Calculate Version
        shell: bash
        run: |
          echo "Getting latest version tag..."

          CURRENT_VERSION=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

          # If there are no existing version tags, start from 0.0.0
          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION="0.0.0"
          fi

          echo "Current Version: $CURRENT_VERSION"

          COMMIT_MESSAGE=$(git log -1 --pretty=%B)

          echo "Commit Message: $COMMIT_MESSAGE"

          if [[ "$COMMIT_MESSAGE" =~ ^major([:\ ]|$) ]]; then
            BUMP_TYPE="major"

          elif [[ "$COMMIT_MESSAGE" =~ ^minor([:\ ]|$) ]]; then
            BUMP_TYPE="minor"

          elif [[ "$COMMIT_MESSAGE" =~ ^patch([:\ ]|$) ]]; then
            BUMP_TYPE="patch"

          else
            echo "Commit message must start with major, minor, or patch"
            exit 1
          fi

          echo "Bump Type: $BUMP_TYPE"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          if [ "$BUMP_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0

          elif [ "$BUMP_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0

          elif [ "$BUMP_TYPE" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "--------------------------------"
          echo "Current Version : $CURRENT_VERSION"
          echo "Bump Type       : $BUMP_TYPE"
          echo "Next Version    : $NEW_VERSION"
          echo "--------------------------------"